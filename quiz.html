<style>
    .quiz-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 1rem;
        font-family: 'Noto Sans KR', sans-serif;
    }

    .quiz-card {
        background: #fff;
        border-radius: 15px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
    }

    .quiz-card:hover {
        transform: translateY(-5px);
    }

    .quiz-question {
        font-size: 1.3rem;
        margin-bottom: 1.5rem;
        color: #333;
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 700;
    }

    .quiz-options {
        display: grid;
        gap: 1rem;
    }

    .quiz-option {
        padding: 1rem;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Noto Sans KR', sans-serif;
        font-size: 1.1rem;
    }

    .quiz-option:hover {
        background-color: #f5f5f5;
        border-color: #ccc;
    }

    .quiz-option.selected {
        background-color: #e3f2fd;
        border-color: #2196f3;
    }

    .quiz-option.correct {
        background-color: #c8e6c9;
        border-color: #4caf50;
    }

    .quiz-option.wrong {
        background-color: #ffcdd2;
        border-color: #f44336;
    }

    .quiz-feedback {
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 10px;
        display: none;
    }

    .quiz-feedback.correct {
        background-color: #e8f5e9;
        color: #2e7d32;
        display: block;
    }

    .quiz-feedback.wrong {
        background-color: #ffebee;
        color: #c62828;
        display: block;
    }

    .quiz-progress {
        margin-bottom: 2rem;
        text-align: center;
    }

    .quiz-progress-bar {
        width: 100%;
        height: 10px;
        background-color: #e0e0e0;
        border-radius: 5px;
        overflow: hidden;
    }

    .quiz-progress-fill {
        height: 100%;
        background-color: #4caf50;
        transition: width 0.3s ease;
    }

    .quiz-score {
        font-size: 1.2rem;
        margin-top: 1rem;
        color: #333;
    }

    .quiz-controls {
        display: flex;
        justify-content: space-between;
        margin-top: 2rem;
    }

    .quiz-button {
        padding: 0.8rem 1.5rem;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 500;
    }

    .quiz-button.next {
        background-color: #2196f3;
        color: white;
    }

    .quiz-button.next:hover {
        background-color: #1976d2;
    }

    .quiz-button.restart {
        background-color: #f5f5f5;
        color: #333;
    }

    .quiz-button.restart:hover {
        background-color: #e0e0e0;
    }

    .quiz-result {
        text-align: center;
        padding: 2rem;
        display: none;
    }

    .quiz-result.show {
        display: block;
    }

    .result-emoji {
        font-size: 4rem;
        margin-bottom: 1rem;
    }

    .result-message {
        font-size: 1.5rem;
        margin-bottom: 1rem;
        color: #333;
    }

    @media (max-width: 768px) {
        .quiz-container {
            padding: 0.5rem;
        }

        .quiz-card {
            padding: 1rem;
        }

        .quiz-question {
            font-size: 1.2rem;
        }

        .quiz-option {
            font-size: 1rem;
        }
    }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">메인 콘텐츠로 바로가기</a>

<div id="header-placeholder"></div>

<main class="main-content" id="main-content">
<div class="container">
<div class="quiz-container">
<h1>재미있는 곤충 퀴즈</h1>
<p>곤충에 대해 얼마나 알고 있는지 퀴즈를 풀어보세요!</p>

<div class="quiz-progress">
<div class="quiz-progress-bar">
<div class="quiz-progress-fill" style="width: 0%"></div>
</div>
<div class="quiz-score">진행: 0/10</div>
</div>

<div class="quiz-card">
<div class="quiz-question">
곤충에 대해 알아보세요!
</div>
<div class="quiz-options">
<!-- 퀴즈 옵션들이 여기에 동적으로 추가됩니다 -->
</div>
<div class="quiz-feedback"></div>
</div>

<div class="quiz-controls">
<button class="quiz-button restart">다시 시작</button>
<button class="quiz-button next">다음 문제</button>
</div>

<div class="quiz-result">
<div class="result-emoji">🎉</div>
<div class="result-message"></div>
<button class="quiz-button restart">다시 도전하기</button>
</div>
</div>
</div>
</main>

<div id="footer-placeholder"></div>

<!-- JavaScript -->
<script src="js/common.js"></script>
